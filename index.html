<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a2b" />
    <!-- PWA: installable to the home screen, runs standalone (zero browser chrome).
         viewport-fit=cover (above) + the safe-area env() probe in main.ts carry the
         notch/home-indicator insets into standalone mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Thrones of Heaven" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>Thrones of Heaven — Washington</title>
    <style>
      /* SAFE-AREA PROPS (Pass 6D): the one source the game reads its insets
         from. env() carries the real device values under viewport-fit=cover;
         the runtime gate overrides these props with phone profiles to prove
         every piece of chrome lays out inside the safe viewport. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1a2b;
        /* Stop the page itself from panning/zooming so touch reaches the game. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
