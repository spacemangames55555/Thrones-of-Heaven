      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1d2e"/>
      <stop offset="1" stop-color="#3a4066"/>
